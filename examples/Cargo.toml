publish = false

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
tokio.workspace = true
url = "2.5"
venom-scanner = { version = "0.9.0-alpha", path = "../crates/venom-scanner", features = ["distributed", "plugins"] }

