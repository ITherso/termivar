[workspace]
members = [
    "crates/termivar-artifact",
    "crates/termivar-core",
    "crates/termivar-exploit",
    "crates/termivar-proxy",
    "crates/termivar-scanner",
    "crates/termivar-api",
    "crates/termivar-cli",
    "examples",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.10.0-alpha.1"
edition = "2021"
rust-version = "1.88"
authors = ["ITherso <e268792@metu.edu.tr>"]
license = "MIT"
repository = "https://github.com/ITherso/venom"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
axum = { version = "0.7", default-features = false }
futures = "0.3"
sha2 = "0.10"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
tempfile = "3.8"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "unwind"
codegen-units = 1
strip = true
