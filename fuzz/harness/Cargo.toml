[package]
name = "termivar-fuzz-harness"
version = "0.0.0"
publish = false
edition = "2021"

[dependencies]
html5ever = "0.39"
markup5ever_rcdom = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
termivar-core = { path = "../../crates/termivar-core" }
termivar-oast = { path = "../../crates/termivar-oast", default-features = false, features = ["client"] }
termivar-scanner = { path = "../../crates/termivar-scanner", default-features = false, features = ["ssrf-oast-review"] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = "0.7"
toml = "0.8"
url = "2.5"
zeroize = "1"

[features]
default = ["ssrf-oast-review"]
oast-correlation = []
oast-native-provider = []
ssrf-oast-review = []
openapi-review = []
