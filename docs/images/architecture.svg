<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Termivar architecture</title>
  <desc id="desc">Legacy scan flow and a parallel host-owned plugin observation boundary, followed by the inward Cargo crate dependency direction.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10253b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ca3ba"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 18px Inter, Segoe UI, Arial, sans-serif; fill: #a9bdd0; }
      .section { font: 700 22px Inter, Segoe UI, Arial, sans-serif; fill: #e2e8f0; letter-spacing: 0.4px; }
      .box-title { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .box-copy { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .chip { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #dbeafe; }
      .label { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #a9bdd0; }
      .edge { fill: none; stroke: #8ca3ba; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #c084fc; stroke-width: 2.5; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .panel { fill: #0b1b2e; stroke: #28435d; stroke-width: 1.5; }
      .host { fill: #133b5c; stroke: #38bdf8; }
      .runner { fill: #174437; stroke: #34d399; }
      .engine { fill: #4a3511; stroke: #fbbf24; }
      .contract { fill: #392052; stroke: #c084fc; }
      .report { fill: #163d38; stroke: #2dd4bf; }
      .core { fill: #123d34; stroke: #34d399; }
      .crate { fill: #132c47; stroke: #60a5fa; }
      .product { fill: #3e234d; stroke: #c084fc; }
    </style>
  </defs>

  <rect width="1600" height="980" rx="28" fill="url(#background)"/>
  <text class="title" x="70" y="74">Termivar Architecture</text>
  <text class="subtitle" x="70" y="108">0.10.0-alpha.1 source · legacy scan flow and inward crate dependencies</text>

  <rect class="panel" x="50" y="145" width="1500" height="475" rx="22"/>
  <text class="section" x="80" y="188">Runtime flow</text>

  <rect class="host" filter="url(#shadow)" x="85" y="250" width="190" height="94" rx="16"/>
  <text class="box-title" x="180" y="288" text-anchor="middle">Host</text>
  <text class="box-copy" x="180" y="315" text-anchor="middle">CLI · library</text>

  <rect class="runner" filter="url(#shadow)" x="345" y="250" width="190" height="94" rx="16"/>
  <text class="box-title" x="440" y="288" text-anchor="middle">Legacy runner</text>
  <text class="box-copy" x="440" y="315" text-anchor="middle">order · timeout · cancel</text>

  <rect class="engine" filter="url(#shadow)" x="610" y="205" width="300" height="184" rx="16"/>
  <text class="box-title" x="760" y="242" text-anchor="middle">Legacy phase pipeline</text>
  <text class="box-copy" x="760" y="267" text-anchor="middle">application-defined ScanPhase contracts</text>
  <g>
    <rect x="638" y="291" width="66" height="30" rx="15" fill="#273f58"/><text class="chip" x="671" y="311" text-anchor="middle">Recon</text>
    <rect x="714" y="291" width="66" height="30" rx="15" fill="#273f58"/><text class="chip" x="747" y="311" text-anchor="middle">Crawl</text>
    <rect x="790" y="291" width="91" height="30" rx="15" fill="#273f58"/><text class="chip" x="835" y="311" text-anchor="middle">Dir · opt-in</text>
    <rect x="652" y="333" width="55" height="30" rx="15" fill="#273f58"/><text class="chip" x="679" y="353" text-anchor="middle">SQLi</text>
    <rect x="717" y="333" width="55" height="30" rx="15" fill="#273f58"/><text class="chip" x="744" y="353" text-anchor="middle">XSS</text>
    <rect x="782" y="333" width="62" height="30" rx="15" fill="#273f58"/><text class="chip" x="813" y="353" text-anchor="middle">SSRF</text>
    <rect x="854" y="333" width="28" height="30" rx="15" fill="#273f58"/><text class="chip" x="868" y="353" text-anchor="middle">+</text>
  </g>

  <rect class="contract" filter="url(#shadow)" x="985" y="205" width="190" height="78" rx="16"/>
  <text class="box-title" x="1080" y="238" text-anchor="middle">Recorded observations</text>
  <text class="box-copy" x="1080" y="261" text-anchor="middle">bounded evidence</text>

  <rect class="contract" filter="url(#shadow)" x="985" y="311" width="190" height="78" rx="16"/>
  <text class="box-title" x="1080" y="344" text-anchor="middle">Event bus</text>
  <text class="box-copy" x="1080" y="367" text-anchor="middle">immutable lifecycle facts</text>

  <rect class="report" filter="url(#shadow)" x="1250" y="250" width="210" height="94" rx="16"/>
  <text class="box-title" x="1355" y="288" text-anchor="middle">Host consumers</text>
  <text class="box-copy" x="1355" y="315" text-anchor="middle">verification · optional reporting</text>

  <rect class="engine" filter="url(#shadow)" x="610" y="455" width="300" height="94" rx="16"/>
  <text class="box-title" x="760" y="491" text-anchor="middle">Plugin context · Preview</text>
  <text class="box-copy" x="760" y="518" text-anchor="middle">bounded broker · recorder · policy</text>

  <path class="edge" d="M 275 297 H 345"/>
  <path class="edge" d="M 535 297 H 610"/>
  <path class="edge" d="M 910 244 H 985"/>
  <path class="edge" d="M 535 315 H 575 Q 590 315 590 405 H 950 Q 965 405 965 350 H 985"/>
  <path class="edge" d="M 1175 244 H 1210 Q 1225 244 1225 270 V 278 H 1250"/>
  <path class="edge" d="M 1175 350 H 1210 Q 1225 350 1225 324 V 316 H 1250"/>
  <path class="edge-dashed" d="M 910 517 H 955 Q 972 517 972 268 V 244 H 985"/>
  <text class="label" x="930" y="506">separate host-owned path</text>

  <rect class="panel" x="50" y="650" width="1500" height="275" rx="22"/>
  <text class="section" x="80" y="693">Cargo workspace dependency direction</text>
  <text class="subtitle" x="80" y="722">Outer products depend on transport-neutral inner contracts; lower layers never import product policy.</text>

  <rect class="product" x="85" y="770" width="235" height="86" rx="16"/>
  <text class="box-title" x="202" y="805" text-anchor="middle">Product layer</text>
  <text class="box-copy" x="202" y="830" text-anchor="middle">future web / dashboard / compliance</text>

  <rect class="crate" x="390" y="770" width="210" height="86" rx="16"/>
  <text class="box-title" x="495" y="805" text-anchor="middle">termivar-cli / adapters</text>
  <text class="box-copy" x="495" y="830" text-anchor="middle">composition / optional shells</text>

  <rect class="crate" x="670" y="770" width="210" height="86" rx="16"/>
  <text class="box-title" x="775" y="805" text-anchor="middle">termivar-scanner</text>
  <text class="box-copy" x="775" y="830" text-anchor="middle">SDK / runner / detection</text>

  <rect class="crate" x="950" y="770" width="210" height="86" rx="16"/>
  <text class="box-title" x="1055" y="805" text-anchor="middle">termivar-proxy</text>
  <text class="box-copy" x="1055" y="830" text-anchor="middle">experimental TCP relay</text>

  <rect class="core" filter="url(#shadow)" x="1230" y="757" width="245" height="112" rx="16"/>
  <text class="box-title" x="1352" y="797" text-anchor="middle">termivar-core</text>
  <text class="box-copy" x="1352" y="824" text-anchor="middle">evidence / reasoning / outcomes</text>
  <text class="box-copy" x="1352" y="846" text-anchor="middle">ontology / predicates / reports</text>

  <path class="edge" d="M 320 813 H 390"/>
  <path class="edge" d="M 600 813 H 670"/>
  <path class="edge" d="M 620 835 V 890 H 1055 V 856"/>
  <path class="edge" d="M 880 790 H 905 Q 925 790 925 744 H 1195 Q 1215 744 1230 780"/>

  <text class="label" x="80" y="955">Portable SVG / suitable for web, print, PDF and presentation workflows</text>
  <text class="label" x="1520" y="955" text-anchor="end">Source: docs/architecture.drawio</text>
</svg>
