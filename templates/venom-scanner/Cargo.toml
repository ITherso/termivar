[package]
name = "{{ project-name }}"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["{{ authors }}"]
license = "MIT"
description = "{{ scanner_description }}"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
venom-scanner = { git = "https://github.com/ITherso/venom", branch = "main", default-features = false, features = ["scanning"] }
