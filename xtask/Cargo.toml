[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
cargo_metadata = "0.18"
clap = { workspace = true, features = ["derive"] }
proc-macro2 = "1"
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
syn = { version = "3", features = ["full", "visit"] }
toml = { workspace = true }
url = "2.5"
termivar-exploit = { path = "../crates/termivar-exploit", version = "=0.10.0-alpha.3" }
termivar-artifact = { path = "../crates/termivar-artifact", version = "=0.10.0-alpha.3" }

[dev-dependencies]
tempfile = { workspace = true }
