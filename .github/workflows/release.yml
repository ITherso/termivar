name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - ".cargo/**"
      - "crates/**"
      - "xtask/**"
      - "deny.toml"
      - "requirements-docs.txt"
      - "mkdocs.yml"
      - "docs/**"
      - "rustfmt.toml"
      - ".github/workflows/release.yml"
      - ".github/release-notes/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-before-release:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Verify tag and release metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$tag_version" = "$workspace_version"
          cargo run --locked -p xtask -- release-metadata "$tag_version"
      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Verify architecture boundaries
        run: cargo run --locked -p xtask -- architecture
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.88.0"

  release-docs:
    name: Release documentation gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: "1.88.0"
      - run: pip install --requirement requirements-docs.txt
      - run: mkdocs build --strict
      - name: Build warning-free Rust API docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --locked

  release-semver:
    name: Release public API compatibility gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.93.0
        with:
          toolchain: "1.93.0"
      - name: Install pinned cargo-semver-checks
        run: cargo install cargo-semver-checks --version 0.50.0 --locked
      - name: Check termivar-core public API
        run: cargo run --locked -p xtask -- semver

  release-rust-security:
    name: Release Rust security gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce licenses, sources, bans, and advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.88.0"
          command: check
          arguments: --all-features

  release-trivy:
    name: Release filesystem security gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  release-semgrep:
    name: Release Semgrep gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.171.0@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan source
        run: >-
          semgrep scan
          --config p/security-audit
          --config p/owasp-top-ten
          --config p/rust
          --error
          --metrics=off
          .

  build-release:
    name: Build ${{ matrix.target }}
    needs:
      - test-before-release
      - release-docs
      - release-semver
      - release-rust-security
      - release-trivy
      - release-semgrep
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: termivar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: termivar
          - os: macos-15
            target: aarch64-apple-darwin
            binary: termivar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: termivar.exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p termivar-cli --features release-bundle
      - name: Smoke release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          release_binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          version_output=$("$release_binary" --version)
          test "$version_output" = "termivar 0.10.0-alpha.2"
          help_output=$("$release_binary" --help)
          scan_help=$("$release_binary" scan --help)
          grep -Fq "Termivar" <<<"$help_output"
          grep -Eq '^  artifact[[:space:]]' <<<"$help_output"
          for flag in \
            --normalization-resilience \
            --graphql-review \
            --openapi-review \
            --rest-review \
            --authorization-review-policy; do
            grep -Fq -- "$flag" <<<"$scan_help"
          done
          if grep -Eq '^  (legacy-scan|api|proxy)[[:space:]]' <<<"$help_output"; then
            echo "release binary exposes a quarantined adapter command" >&2
            exit 1
          fi
      - name: Smoke release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseBinary = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $versionOutput = ((& $releaseBinary --version) | Out-String).Trim()
          if ($versionOutput -ne "termivar 0.10.0-alpha.2") {
            throw "unexpected release binary identity"
          }
          $helpOutput = ((& $releaseBinary --help) | Out-String)
          $scanHelp = ((& $releaseBinary scan --help) | Out-String)
          if (-not $helpOutput.Contains("Termivar")) {
            throw "release help does not identify Termivar"
          }
          if ($helpOutput -notmatch '(?m)^  artifact\s') {
            throw "release help is missing the artifact command"
          }
          foreach ($flag in @(
            "--normalization-resilience",
            "--graphql-review",
            "--openapi-review",
            "--rest-review",
            "--authorization-review-policy"
          )) {
            if (-not $scanHelp.Contains($flag)) {
              throw "release scan help is missing an approved option"
            }
          }
          if ($helpOutput -match '(?m)^  (legacy-scan|api|proxy)\s') {
            throw "release binary exposes a quarantined adapter command"
          }
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/stage/termivar
          tar -C dist/stage -czf "dist/termivar-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" termivar
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/stage -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/stage/termivar.exe"
          Compress-Archive -Path "dist/stage/termivar.exe" -DestinationPath "dist/termivar-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
      - name: Generate build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "dist/termivar-*"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/termivar-*
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Reverify tag identity and create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
          (
            cd release-assets
            sha256sum termivar-* | sort -k2 > ../SHA256SUMS
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "refusing to replace the existing release for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          test ! -L "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            release-assets/termivar-* SHA256SUMS \
            --verify-tag \
            --notes-file "$notes_file" \
            --title "Termivar $GITHUB_REF_NAME" \
            --prerelease
