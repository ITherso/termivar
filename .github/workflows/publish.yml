name: Publish Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  github-release:
    name: Validate and publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Tag version $tag_version does not match Cargo version $cargo_version" >&2
            exit 1
          fi

      - name: Test release build
        run: cargo test --release --workspace --locked

      - name: Build CLI artifact
        run: cargo build --release --locked -p venom-cli

      - name: Package artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="venom-${version}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czf "$archive" -C target/release venom
          sha256sum "$archive" > "${archive}.sha256"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="venom-${version}-x86_64-unknown-linux-gnu.tar.gz"
          release_args=(
            "$GITHUB_REF_NAME"
            "$archive"
            "${archive}.sha256"
            --verify-tag
            --generate-notes
            --title "Venom $GITHUB_REF_NAME"
          )
          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
