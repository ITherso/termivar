name: Scheduled Fuzzing

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - "crates/venom-scanner/src/http_evidence.rs"
      - "crates/venom-scanner/src/http_evidence/form_controls.rs"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-target-contract:
    name: Venom-owned seed replay and compile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fuzz
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Verify fuzz lockfile
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --no-deps --format-version 1 > /dev/null
      - name: Replay committed semantic corpus
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_STRIP: "none"
        run: cargo test --manifest-path fuzz/harness/Cargo.toml --locked
      - name: Compile Venom-owned target
        working-directory: fuzz
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_STRIP: "none"
        run: cargo fuzz build html_form_controls

  fuzz:
    name: ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [http_parser, json_parser, yaml_parser, xml_parser, text_parser, html_form_controls]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fuzz
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Verify fuzz lockfile
        working-directory: fuzz
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Run bounded campaign
        working-directory: fuzz
        shell: bash
        env:
          # Sanitizer coverage and whole-program LTO do not compose reliably.
          # Keep release LTO for product binaries, but disable it for fuzz harnesses.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_STRIP: "none"
        run: |
          set -uo pipefail
          mkdir -p "reports/${{ matrix.target }}"
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          started_epoch=$(date +%s)
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time=60 \
            -max_len=65536 \
            -timeout=5 \
            -rss_limit_mb=1024 \
            -seed=1337 \
            -print_final_stats=1 \
            2>&1 | tee "reports/${{ matrix.target }}/libfuzzer.log"
          fuzz_exit=${PIPESTATUS[0]}
          elapsed_seconds=$(($(date +%s) - started_epoch))
          corpus_files=$(find "corpus/${{ matrix.target }}" -type f 2>/dev/null | wc -l | tr -d ' ')
          artifact_files=$(find "artifacts/${{ matrix.target }}" -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$fuzz_exit" -eq 0 ]; then outcome=passed; else outcome=failed; fi
          {
            echo "# Bounded fuzz report: ${{ matrix.target }}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Started | ${started_at} |"
            echo "| Wall time | ${elapsed_seconds} s |"
            echo "| Budget | 60 s, 64 KiB/input, 5 s/input, 1024 MiB RSS |"
            echo "| Outcome | ${outcome} |"
            echo "| Exit code | ${fuzz_exit} |"
            echo "| Corpus files after run | ${corpus_files} |"
            echo "| Crash artifacts | ${artifact_files} |"
            echo
            echo "This bounded CI campaign is a regression signal, not proof of parser safety."
          } | tee "reports/${{ matrix.target }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$fuzz_exit"
      - name: Upload campaign report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-report-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/reports/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 90
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
