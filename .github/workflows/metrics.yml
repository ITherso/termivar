name: Quality Metrics

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    name: Build and Benchmark Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Measure release build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/quality-metrics
          build_started=$(date +%s)
          /usr/bin/time -v -o target/quality-metrics/build-time.txt \
            cargo build --locked --release -p termivar-cli --timings
          build_seconds=$(($(date +%s) - build_started))
          binary_bytes=$(stat --format=%s target/release/termivar)
          build_peak_kib=$(awk -F: '/Maximum resident set size/ {gsub(/^[[:space:]]+/, "", $2); print $2}' target/quality-metrics/build-time.txt)
          cp target/cargo-timings/cargo-timing.html target/quality-metrics/
          printf '%s\n' "$build_seconds" > target/quality-metrics/build-seconds.txt
          printf '%s\n' "$binary_bytes" > target/quality-metrics/binary-bytes.txt
          printf '%s\n' "$build_peak_kib" > target/quality-metrics/build-peak-rss-kib.txt

      - name: Measure Criterion suite
        shell: bash
        run: |
          set -euo pipefail
          benchmark_started=$(date +%s)
          /usr/bin/time -v -o target/quality-metrics/benchmark-time.txt \
            cargo bench --locked -p termivar-scanner --bench scanner_benchmarks -- --noplot
          benchmark_seconds=$(($(date +%s) - benchmark_started))
          benchmark_peak_kib=$(awk -F: '/Maximum resident set size/ {gsub(/^[[:space:]]+/, "", $2); print $2}' target/quality-metrics/benchmark-time.txt)
          printf '%s\n' "$benchmark_seconds" > target/quality-metrics/benchmark-seconds.txt
          printf '%s\n' "$benchmark_peak_kib" > target/quality-metrics/benchmark-peak-rss-kib.txt

      - name: Create metrics summary
        shell: bash
        run: |
          set -euo pipefail
          build_seconds=$(cat target/quality-metrics/build-seconds.txt)
          binary_bytes=$(cat target/quality-metrics/binary-bytes.txt)
          build_peak_kib=$(cat target/quality-metrics/build-peak-rss-kib.txt)
          benchmark_seconds=$(cat target/quality-metrics/benchmark-seconds.txt)
          benchmark_peak_kib=$(cat target/quality-metrics/benchmark-peak-rss-kib.txt)
          {
            echo "# Termivar quality metrics"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Release compile time | ${build_seconds} s |"
            echo "| Release binary size | ${binary_bytes} bytes |"
            echo "| Build peak RSS | ${build_peak_kib} KiB |"
            echo "| Criterion suite wall time | ${benchmark_seconds} s |"
            echo "| Criterion peak RSS | ${benchmark_peak_kib} KiB |"
            echo
            echo "Rust: \`$(rustc --version)\`"
            echo
            echo "These runner-local values are regression signals, not published capacity claims."
          } | tee target/quality-metrics/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-metrics-${{ github.sha }}
          path: |
            target/quality-metrics/
            target/criterion/
          if-no-files-found: error
          retention-days: 30
