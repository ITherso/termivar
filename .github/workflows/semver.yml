name: venom-core Public API Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver:
    name: Public API Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.93.0 (MSRV)
        with:
          toolchain: "1.93.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned cargo-semver-checks
        run: cargo install cargo-semver-checks --version 0.50.0 --locked
      - name: Check venom-core public API
        run: cargo run --locked -p xtask -- semver
