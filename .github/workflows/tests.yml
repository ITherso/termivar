name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, 'agent/**' ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  distribution-contracts:
    name: Distribution Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build default CLI container
        run: docker build --tag termivar:ci .
      - name: Verify container contract
        run: sh tests/distribution/container-contract.sh termivar:ci

  architecture:
    name: Architecture Boundaries
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test development-line provenance contract
        run: cargo test --locked -p xtask development_line
      - name: Verify post-release development-line provenance
        run: cargo run --locked -p xtask -- development-line
      - name: Verify workspace and reasoning boundaries
        run: cargo run --locked -p xtask -- architecture
      - name: Test transport-free scanner contracts
        run: cargo test --locked -p termivar-scanner --no-default-features --lib

  historical-scanner-salvage:
    name: Historical Scanner Salvage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test historical scanner salvage validator
        run: cargo test --locked -p xtask scanner_salvage
      - name: Validate historical scanner salvage ledger
        run: cargo run --locked -p xtask -- scanner-salvage

  post-workspace-waf-evasion-salvage:
    name: Post-Workspace WAF/Evasion Salvage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test post-workspace WAF/evasion salvage validator
        run: cargo test --locked -p xtask waf_evasion_salvage
      - name: Validate post-workspace WAF/evasion salvage ledger
        run: cargo run --locked -p xtask -- waf-evasion-salvage
      - name: Revalidate pre-workspace historical scanner salvage ledger
        run: cargo run --locked -p xtask -- scanner-salvage

  scanner-conformance-corpus:
    name: Scanner Conformance Corpus
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test scanner conformance corpus contracts
        run: cargo test --locked -p xtask scanner_corpus
      - name: Validate scanner conformance corpus
        run: cargo run --locked -p xtask -- scanner-corpus
      - name: Exercise corpus through current scanner semantics
        run: cargo test --locked -p termivar-scanner --all-features versioned_scanner_corpus_dispatches_through_current_production_semantics

  artifact-signature-catalog:
    name: Artifact Signature Catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test bounded artifact signature contracts
        run: cargo test --locked -p termivar-artifact
      - name: Test repository artifact catalog validator
        run: cargo test --locked -p xtask artifact_catalog
      - name: Validate repository artifact signature catalog
        run: cargo run --locked -p xtask -- artifact-catalog
      - name: Test opt-in local-file adapter
        run: cargo test --locked -p termivar-cli --no-default-features --features artifact-adapter --test artifact_cli

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run unit tests
        run: cargo test --locked --lib --verbose
      - name: Run doc tests
        run: cargo test --locked --doc --verbose
      - name: Verify default and opt-in CLI contracts
        run: |
          cargo test --locked -p termivar-cli --no-default-features
          cargo test --locked -p termivar-cli --no-default-features --features legacy-scanner
          cargo test --locked -p termivar-cli --no-default-features --features api-adapter
          cargo test --locked -p termivar-cli --no-default-features --features proxy-adapter
          cargo test --locked -p termivar-cli --no-default-features --features artifact-adapter
          cargo test --locked -p termivar-cli --no-default-features --features normalization-resilience
          cargo test --locked -p termivar-cli --no-default-features --features ssrf-oast-review
      - name: Verify scanner feature boundaries independently
        run: |
          set -euo pipefail
          for feature in \
            core scanning normalization-resilience oast-correlation oast-native-provider ssrf-oast-review legacy-scanner platform-models reporting detection ml \
            distributed monitoring compliance threat-intel plugins lua
          do
            cargo test --locked -p termivar-scanner --no-default-features --features "$feature" --lib --tests
          done
          for aggregate in minimal full enterprise research
          do
            cargo check --locked -p termivar-scanner --no-default-features --features "$aggregate"
          done

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run integration tests
        run: cargo test --workspace --test '*' --all-features --locked --verbose

  plugin-template:
    name: Plugin Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Render and test generated plugin
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir=$(mktemp -d)
          cp -R templates/termivar-plugin/. "$plugin_dir/"
          sed -i \
            -e 's/{{ project-name }}/termivar-plugin-smoke/g' \
            -e 's/{{ authors }}/Termivar CI/g' \
            -e 's/{{ plugin_id }}/smoke-plugin/g' \
            -e 's/{{ plugin_description }}/CI smoke plugin/g' \
            "$plugin_dir/Cargo.toml" \
            "$plugin_dir/src/lib.rs" \
            "$plugin_dir/README.md"
          sed -i \
            "s#termivar-scanner = .*#termivar-scanner = { path = \"${GITHUB_WORKSPACE}/crates/termivar-scanner\", default-features = false, features = [\"plugins\"] }#" \
            "$plugin_dir/Cargo.toml"
          cargo test --manifest-path "$plugin_dir/Cargo.toml"

  scanner-template:
    name: Scanner SDK Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Render and test generated scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          cp -R templates/termivar-scanner/. "$scanner_dir/"
          sed -i \
            -e 's/{{ project-name }}/termivar-scanner-smoke/g' \
            -e 's/{{ authors }}/Termivar CI/g' \
            -e 's/{{ scanner_description }}/CI scanner SDK smoke project/g' \
            "$scanner_dir/Cargo.toml" \
            "$scanner_dir/README.md"
          sed -i \
            "s#termivar-scanner = .*#termivar-scanner = { path = \"${GITHUB_WORKSPACE}/crates/termivar-scanner\", default-features = false, features = [\"legacy-scanner\"] }#" \
            "$scanner_dir/Cargo.toml"
          cargo test --manifest-path "$scanner_dir/Cargo.toml"

  platform-runtime-smoke:
    name: Runtime Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build default CLI
        run: cargo build --locked -p termivar-cli
      - name: Exercise CLI metadata
        run: |
          cargo run --locked -p termivar-cli -- --version
          cargo run --locked -p termivar-cli -- --help
      - name: Test first-use fixture and checked-in sample contracts
        run: python -m unittest discover -s scripts/tests -p 'test_first_use*.py'
      - name: Test release archive verification contracts
        run: python -m unittest discover -s scripts/tests -p test_verify_release_archive.py
      - name: Accept the actual development CLI against its own loopback fixture
        run: >-
          python scripts/first_use.py
          --binary ${{ runner.os == 'Windows' && 'target/debug/termivar.exe' || 'target/debug/termivar' }}
          --output "${{ runner.temp }}/termivar-first-use-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-source"
          --source-ref ${{ github.event.pull_request.head.sha || github.sha }}
          --build-features default
          --expect-version 0.10.0-alpha.2
      - name: Acquire the exact published Linux prerelease for separate acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          download_dir="${{ runner.temp }}/termivar-first-use-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-release-download"
          extract_dir="${{ runner.temp }}/termivar-first-use-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-release-binary"
          mkdir -m 700 "$download_dir"
          release_url=https://github.com/ITherso/termivar/releases/download/v0.10.0-alpha.1
          archive=termivar-v0.10.0-alpha.1-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 "$release_url/SHA256SUMS" --output "$download_dir/SHA256SUMS"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 "$release_url/$archive" --output "$download_dir/$archive"
          echo "7e815a89385f7470a01656b407735b337cf45a0aec9fec84ffd4eab6bf54cf5e  $download_dir/SHA256SUMS" | sha256sum --check --strict -
          python scripts/verify_release_archive.py --archive "$download_dir/$archive" --checksums "$download_dir/SHA256SUMS"
          python scripts/verify_release_archive.py --archive "$download_dir/$archive" --checksums "$download_dir/SHA256SUMS" --extract-to "$extract_dir"
      - name: Accept the verified published Linux binary without a source substitute
        if: runner.os == 'Linux'
        run: >-
          python scripts/first_use.py
          --binary "${{ runner.temp }}/termivar-first-use-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-release-binary/termivar"
          --output "${{ runner.temp }}/termivar-first-use-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-release"
          --source-ref v0.10.0-alpha.1
          --build-features release-bundle
          --expect-version 0.10.0-alpha.1
      - name: Retain bounded first-use acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-use-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/termivar-first-use-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-source/
            ${{ runner.temp }}/termivar-first-use-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-release/
          if-no-files-found: error
          retention-days: 30
      - name: Exercise default decision scan against loopback
        run: cargo test --locked -p termivar-cli --test decision_scan_cli json_format_writes_parseable_json_to_stdout_and_the_runtime_notice_to_stderr
      - name: Exercise atomic report-output path semantics
        run: cargo test --locked -p termivar-cli --test profile_scan_cli report_output_is_complete_atomic_and_never_overwritten
      - name: Exercise offline report comparison CLI
        run: cargo test --locked -p termivar-cli --test report_compare_cli
      - name: Test fixed offline comparison controls without a browser
        run: python -m unittest discover -s scripts/tests -p test_report_compare_ui.py
      - name: Exercise credential input handle and buffer contracts
        run: cargo test --locked -p termivar-cli --no-default-features --features authorization-review,ssrf-oast-review --bin termivar auth_input::tests
      - name: Exercise provider secret-file contracts
        run: cargo test --locked -p termivar-oast --features server --bin termivar-oast-provider
      - name: Exercise focused core and scanner contracts
        run: |
          cargo test --locked -p termivar-core --lib report_round_trip_and_golden_are_stable
          cargo test --locked -p termivar-scanner --lib authority_narrows_a_broader_policy_to_one_exact_origin
          cargo test --locked -p termivar-scanner --lib redirect_is_observed_without_following_the_location

  downstream-current-head:
    name: Downstream Current-Head Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test default core consumer
        run: cargo test --manifest-path compat/current-head/Cargo.toml --locked -p termivar-current-head-core-consumer
      - name: Test deterministic assessment consumer
        run: cargo test --manifest-path compat/current-head/Cargo.toml --locked -p termivar-current-head-deterministic-assessment-consumer
      - name: Test historical Scanner SDK consumer
        run: cargo test --manifest-path compat/current-head/Cargo.toml --locked -p termivar-current-head-scanner-sdk-consumer
      - name: Test plugin API 0.2 consumer
        run: cargo test --manifest-path compat/current-head/Cargo.toml --locked -p termivar-current-head-plugin-api-0-2-consumer

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install canonical Rust 1.88.0 formatter
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --no-self-update
      - name: Check canonical formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Run pinned RustSec audit
        run: bash scripts/ci/run-cargo-audit.sh
      - name: Run clippy (security lints)
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test coverage policy checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_coverage_gate.py'
      - name: Install pinned tarpaulin
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          cargo +1.91.0 install cargo-tarpaulin --version 0.37.2 --locked
      - name: Generate coverage
        run: cargo +1.88.0 tarpaulin --locked --workspace --all-features --ignore-tests --ignore-config --engine llvm --out Xml --timeout 300
      - name: Attempt best-effort advisory Codecov upload
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
      - name: Enforce repository coverage policy
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/coverage_gate.py --cobertura cobertura.xml --baseline-pointer docs/reports/coverage/accepted-baseline.txt --summary-json coverage-summary.json --summary-markdown coverage-summary.md --require-base
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-evidence
          path: |
            cobertura.xml
            coverage-summary.json
            coverage-summary.md
          if-no-files-found: error

  compatibility:
    name: Rust Compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.88.0", stable, beta, nightly]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # toolchain via matrix input
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check
        run: cargo check --workspace --all-features --locked
      - name: Test
        run: cargo test --workspace --all-features --locked

  performance-regression:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run benchmarks
        run: cargo bench --no-run
      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: target/criterion/
