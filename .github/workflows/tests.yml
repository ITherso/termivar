name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, 'agent/**' ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  distribution-contracts:
    name: Distribution Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build default CLI container
        run: docker build --tag venom:ci .
      - name: Verify container contract
        run: sh tests/distribution/container-contract.sh venom:ci

  architecture:
    name: Architecture Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Verify workspace and reasoning boundaries
        run: cargo run --locked -p xtask -- architecture
      - name: Test transport-free scanner contracts
        run: cargo test --locked -p venom-scanner --no-default-features --lib

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run unit tests
        run: cargo test --locked --lib --verbose
      - name: Run doc tests
        run: cargo test --locked --doc --verbose
      - name: Verify default and opt-in CLI contracts
        run: |
          cargo test --locked -p venom-cli --no-default-features
          cargo test --locked -p venom-cli --no-default-features --features legacy-scanner
          cargo test --locked -p venom-cli --no-default-features --features api-adapter
          cargo test --locked -p venom-cli --no-default-features --features proxy-adapter
      - name: Verify scanner feature boundaries independently
        run: |
          set -euo pipefail
          for feature in \
            core scanning legacy-scanner platform-models reporting detection ml \
            distributed monitoring compliance threat-intel plugins lua
          do
            cargo test --locked -p venom-scanner --no-default-features --features "$feature" --lib --tests
          done
          for aggregate in minimal full enterprise research
          do
            cargo check --locked -p venom-scanner --no-default-features --features "$aggregate"
          done

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run integration tests
        run: cargo test --workspace --test '*' --all-features --locked --verbose

  plugin-template:
    name: Plugin Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Render and test generated plugin
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir=$(mktemp -d)
          cp -R templates/venom-plugin/. "$plugin_dir/"
          sed -i \
            -e 's/{{ project-name }}/venom-plugin-smoke/g' \
            -e 's/{{ authors }}/Venom CI/g' \
            -e 's/{{ plugin_id }}/smoke-plugin/g' \
            -e 's/{{ plugin_description }}/CI smoke plugin/g' \
            "$plugin_dir/Cargo.toml" \
            "$plugin_dir/src/lib.rs" \
            "$plugin_dir/README.md"
          sed -i \
            "s#venom-scanner = .*#venom-scanner = { path = \"${GITHUB_WORKSPACE}/crates/venom-scanner\", default-features = false, features = [\"plugins\"] }#" \
            "$plugin_dir/Cargo.toml"
          cargo test --manifest-path "$plugin_dir/Cargo.toml"

  scanner-template:
    name: Scanner SDK Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Render and test generated scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          cp -R templates/venom-scanner/. "$scanner_dir/"
          sed -i \
            -e 's/{{ project-name }}/venom-scanner-smoke/g' \
            -e 's/{{ authors }}/Venom CI/g' \
            -e 's/{{ scanner_description }}/CI scanner SDK smoke project/g' \
            "$scanner_dir/Cargo.toml" \
            "$scanner_dir/README.md"
          sed -i \
            "s#venom-scanner = .*#venom-scanner = { path = \"${GITHUB_WORKSPACE}/crates/venom-scanner\", default-features = false, features = [\"legacy-scanner\"] }#" \
            "$scanner_dir/Cargo.toml"
          cargo test --manifest-path "$scanner_dir/Cargo.toml"

  platform-runtime-smoke:
    name: Runtime Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build default CLI
        run: cargo build --locked -p venom-cli
      - name: Exercise CLI metadata
        run: |
          cargo run --locked -p venom-cli -- --version
          cargo run --locked -p venom-cli -- --help
      - name: Exercise default decision scan against loopback
        run: cargo test --locked -p venom-cli --test decision_scan_cli json_format_writes_parseable_json_to_stdout_and_the_runtime_notice_to_stderr
      - name: Exercise atomic report-output path semantics
        run: cargo test --locked -p venom-cli --test profile_scan_cli report_output_is_complete_atomic_and_never_overwritten
      - name: Exercise focused core and scanner contracts
        run: |
          cargo test --locked -p venom-core --lib report_round_trip_and_golden_are_stable
          cargo test --locked -p venom-scanner --lib authority_narrows_a_broader_policy_to_one_exact_origin
          cargo test --locked -p venom-scanner --lib redirect_is_observed_without_following_the_location

  downstream-current-head:
    name: Downstream Current-Head Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test default core consumer
        run: cargo test --manifest-path compat/current-head/Cargo.toml --locked -p venom-current-head-core-consumer
      - name: Test deterministic assessment consumer
        run: cargo test --manifest-path compat/current-head/Cargo.toml --locked -p venom-current-head-deterministic-assessment-consumer
      - name: Test historical Scanner SDK consumer
        run: cargo test --manifest-path compat/current-head/Cargo.toml --locked -p venom-current-head-scanner-sdk-consumer
      - name: Test plugin API 0.2 consumer
        run: cargo test --manifest-path compat/current-head/Cargo.toml --locked -p venom-current-head-plugin-api-0-2-consumer

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit
      - name: Run clippy (security lints)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test coverage policy checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_coverage_gate.py'
      - name: Install pinned tarpaulin
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          cargo +1.91.0 install cargo-tarpaulin --version 0.37.2 --locked
      - name: Generate coverage
        run: cargo +1.88.0 tarpaulin --locked --workspace --all-features --ignore-tests --ignore-config --engine llvm --out Xml --timeout 300
      - name: Attempt best-effort advisory Codecov upload
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
      - name: Enforce repository coverage policy
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/coverage_gate.py --cobertura cobertura.xml --baseline-pointer docs/reports/coverage/accepted-baseline.txt --summary-json coverage-summary.json --summary-markdown coverage-summary.md --require-base
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-evidence
          path: |
            cobertura.xml
            coverage-summary.json
            coverage-summary.md
          if-no-files-found: error

  compatibility:
    name: Rust Compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.88.0", stable, beta, nightly]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # toolchain via matrix input
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check
        run: cargo check --workspace --all-features --locked
      - name: Test
        run: cargo test --workspace --all-features --locked

  performance-regression:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run benchmarks
        run: cargo bench --no-run
      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: target/criterion/
