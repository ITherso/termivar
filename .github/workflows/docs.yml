name: Documentation

on:
  pull_request:
    paths:
      - "README.md"
      - "FEATURES.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "deny.toml"
      - ".cargo/config.toml"
      - "xtask/**"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/*.rs"
      - "crates/**/Cargo.toml"
      - "templates/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "FEATURES.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "deny.toml"
      - ".cargo/config.toml"
      - "xtask/**"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/*.rs"
      - "crates/**/Cargo.toml"
      - "templates/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install --requirement requirements-docs.txt
      - run: mkdocs build --strict
      - name: Build Rust API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --all-features --no-deps --locked
          mkdir -p site/rust
          cp -R target/doc/. site/rust/
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
