name: Manual container build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an unsupported, commit-scoped development image to GHCR
        required: true
        default: false
        type: boolean

concurrency:
  group: manual-container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate CLI distribution contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test default CLI
        run: cargo test --locked -p termivar-cli
      - name: Install canonical Rust 1.88.0 formatter
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --no-self-update
      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check

  container:
    name: Build non-root CLI container
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build local image
        run: docker build --tag termivar:manual-test .
      - name: Verify container contract
        run: sh tests/distribution/container-contract.sh termivar:manual-test
      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract commit-scoped image metadata
        if: inputs.publish
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=long,prefix=manual-
      - name: Publish commit-scoped development image
        if: inputs.publish
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tags }}
        run: |
          docker tag termivar:manual-test "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
