schema = "security-assessment-fixture/v1"
id = "graphql.introspection-available"
revision = 1
category = "api-graphql"
purpose = "Exercise the exact bounded schema-root introspection envelope used by GraphQL review."
provenance = "current-authored"
support = "current"
tags = ["graphql", "introspection", "protocol"]

[request]
method = "post"
origin = "https://api.example.test"
path = "/graphql"
role = "bootstrap"
body_media_type = "application/json"
inline_body = '''{"query":"query VenomGraphqlCandidateV1 { venomCandidateV1: __typename __schema { queryType { name } mutationType { name } subscriptionType { name } } }"}'''

[[request.headers]]
name = "accept"
value = "application/graphql-response+json, application/json"

[[request.headers]]
name = "content-type"
value = "application/json"

[response]
status = 200
media_type = "application/graphql-response+json"
role = "bootstrap"
completion = "complete"
truncated = false
body_file = "bodies/graphql-introspection.json"

[expected]
graphql_evidence = "introspection-available"
maximum_disposition = "informational"
maximum_authority = "knowledge-only"
