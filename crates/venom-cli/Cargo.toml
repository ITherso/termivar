[package]
name = "venom-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line composition layer for the Venom security-testing framework"
homepage = "https://github.com/ITherso/venom"
keywords = ["security", "scanner", "pentesting", "cli"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "venom"
path = "src/main.rs"

[features]
default = []
legacy-scanner = ["dep:reqwest", "venom-scanner/legacy-scanner"]
api-adapter = ["dep:venom-api"]
proxy-adapter = ["dep:venom-proxy"]

[dependencies]
venom-core = { version = "0.9.0-alpha", path = "../venom-core" }
venom-scanner = { version = "0.9.0-alpha", path = "../venom-scanner", default-features = false, features = ["scanning"] }
venom-api = { version = "0.9.0-alpha", path = "../venom-api", optional = true }
venom-proxy = { version = "0.9.0-alpha", path = "../venom-proxy", optional = true }
tokio = { workspace = true }
reqwest = { workspace = true, optional = true }
url = "2.5"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
