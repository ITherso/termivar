[package]
name = "venom-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line composition layer for the Venom security-testing framework"
homepage = "https://github.com/ITherso/venom"
keywords = ["security", "scanner", "pentesting", "cli"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "venom"
path = "src/main.rs"

[features]
default = []
legacy-scanner = ["dep:reqwest", "venom-scanner/legacy-scanner"]
api-adapter = ["dep:venom-api"]
proxy-adapter = ["dep:venom-proxy"]
artifact-adapter = ["dep:venom-artifact"]
normalization-resilience = ["venom-scanner/normalization-resilience"]
graphql-review = ["venom-scanner/graphql-review"]
openapi-review = ["venom-scanner/openapi-review"]
rest-review = ["openapi-review", "venom-scanner/rest-review"]
authorization-review = ["venom-scanner/authorization-review"]

[dependencies]
venom-core = { version = "0.10.0-alpha.1", path = "../venom-core" }
venom-scanner = { version = "0.10.0-alpha.1", path = "../venom-scanner", default-features = false, features = ["scanning", "reporting"] }
venom-api = { version = "0.10.0-alpha.1", path = "../venom-api", optional = true }
venom-proxy = { version = "0.10.0-alpha.1", path = "../venom-proxy", optional = true }
venom-artifact = { version = "=0.10.0-alpha.1", path = "../venom-artifact", optional = true }
tokio = { workspace = true }
reqwest = { workspace = true, optional = true }
url = "2.5"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
