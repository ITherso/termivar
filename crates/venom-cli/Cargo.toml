[package]
name = "venom-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line composition layer for the Venom security-testing framework"
homepage = "https://github.com/ITherso/venom"
keywords = ["security", "scanner", "pentesting", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "venom"
path = "src/main.rs"

[dependencies]
venom-core = { version = "0.9.0-alpha", path = "../venom-core" }
venom-scanner = { version = "0.9.0-alpha", path = "../venom-scanner" }
venom-api = { version = "0.9.0-alpha", path = "../venom-api" }
venom-proxy = { version = "0.9.0-alpha", path = "../venom-proxy" }
tokio = { workspace = true }
reqwest = { workspace = true }
url = "2.5"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
