[package]
name = "venom-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable scanner SDK, execution pipeline, plugins, and reporting for Venom"
homepage = "https://github.com/ITherso/venom"
documentation = "https://itherso.github.io/venom/rust/venom_scanner/"
keywords = ["security", "scanner", "pentesting", "sdk", "async"]
categories = ["development-tools", "network-programming"]

[dependencies]
venom-core = { version = "0.9.0-alpha", path = "../venom-core" }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "cookies"] }
async-trait = "0.1"
dashmap = "5.5"
url = "2.5"
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
memmap2 = { workspace = true }
nom = { workspace = true }
mlua = { version = "0.9", features = ["lua54", "serialize", "vendored"] }
tempfile = "3.8"

[dev-dependencies]
criterion = "0.5"

[features]
# Default features: core scanner with detection capabilities
default = ["core", "scanning", "detection"]

# Core scanning engine (always compiled)
core = []

# Vulnerability scanning phases
scanning = ["core"]

# Detection & analysis capabilities
detection = ["scanning"]

# Machine learning for pattern discovery
ml = ["detection"]

# Distributed scaling (worker pools, task queues)
distributed = ["scanning"]

# Performance monitoring & profiling
monitoring = ["scanning"]

# Compliance & audit logging
compliance = ["scanning"]

# Threat intelligence feeds & correlation
threat-intel = ["detection"]

# Plugin system support
plugins = ["core"]

# Full-featured scanner (all capabilities)
full = ["core", "scanning", "detection", "ml", "distributed", "monitoring", "compliance", "threat-intel", "plugins"]

# Minimal scanner (just core phases, no advanced features)
minimal = ["core", "scanning"]

# Enterprise package (everything except threat-intel)
enterprise = ["core", "scanning", "detection", "ml", "distributed", "monitoring", "compliance", "plugins"]

# Research package (all features enabled)
research = ["full"]

[lib]
name = "venom_scanner"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[[bench]]
name = "scanner_benchmarks"
harness = false
