[package]
name = "venom-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Experimental HTTP and TLS proxy boundary for the Venom framework"
homepage = "https://github.com/ITherso/venom"
documentation = "https://itherso.github.io/venom/rust/venom_proxy/"
keywords = ["security", "proxy", "http", "tls"]
categories = ["network-programming"]

[lints]
workspace = true

[dependencies]
venom-core = { version = "0.9.0-alpha", path = "../venom-core" }
tokio = { workspace = true }
hyper = { workspace = true }
http = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
rcgen = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[lib]
name = "venom_proxy"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
