[package]
name = "termivar-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-neutral reasoning, evidence, ontology, and run-report contracts for Termivar"
homepage = "https://github.com/ITherso/venom"
documentation = "https://itherso.github.io/venom/rust/termivar_core/"
keywords = ["security", "reasoning", "evidence"]
categories = ["development-tools"]

[lints]
workspace = true

[features]
default = []

# Historical pre-quarantine facade retained for the pinned alpha compatibility
# baseline. It is not part of the default reasoning/report contract.
legacy-contracts = ["dep:serde_json", "dep:toml"]

[dependencies]
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "termivar_core"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
