[package]
name = "venom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared events, findings, configuration, errors, and models for the Venom framework"
homepage = "https://github.com/ITherso/venom"
documentation = "https://itherso.github.io/venom/rust/venom_core/"
keywords = ["security", "events", "framework"]
categories = ["development-tools"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
memmap2 = { workspace = true }

[lib]
name = "venom_core"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
