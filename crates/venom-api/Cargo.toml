[package]
name = "venom-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Experimental Axum HTTP adapter for the Venom framework"
homepage = "https://github.com/ITherso/venom"
documentation = "https://itherso.github.io/venom/rust/venom_api/"
keywords = ["security", "http", "axum", "api"]
categories = ["web-programming::http-server"]

[lints]
workspace = true

[dependencies]
venom-core = { version = "0.9.0-alpha", path = "../venom-core" }
venom-scanner = { version = "0.9.0-alpha", path = "../venom-scanner" }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[lib]
name = "venom_api"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
